name: CI

on:
  push:
    branches: [main, test]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # The test harness provisions its own `_test` database inside this
      # instance; see tests/setup/global.ts.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # tests/setup/test-db-url.ts derives the throwaway database from this and
      # refuses anything whose name does not end in `_test`.
      DATABASE_URL_LOCAL: postgresql://postgres:postgres@localhost:5432/portfolio?schema=public
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio?schema=public
      AUTH_SECRET: ci-only-secret-not-used-for-anything-real-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must match the toolchain the lockfile is generated with, and must
          # be >= 22: @prisma/streams-local declares `node >=22` and Node 20
          # produced an EBADENGINE warning on every run.
          node-version: 22
          cache: npm

      # npm 10 and npm 11 resolve optional platform dependencies differently.
      # A lockfile written by npm 11 (Node 22 ships npm 10.x, so developers on
      # npm 11 are common) fails `npm ci` under npm 10 with
      # "Missing: @emnapi/runtime from lock file" — the wasm optional deps of
      # sharp and tailwind's oxide binding. Pinning the major keeps CI and the
      # lockfile in agreement.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Guards the DRAFT -> PUBLISHED promotion contract. A version-table column
      # missing from PROMOTED_FIELDS is invisible to both the promotion and the
      # change detection at once, so publishing silently never updates it while
      # the admin reports "nothing to publish". This has happened before.
      - name: Promotion contract
        run: npm run check:promoted

      - name: Tests
        run: npm test

      # The test harness creates its own `portfolio_test` database. The build
      # reads from the separate `portfolio` database, so it must receive the
      # tracked schema and required singleton records before prerendering.
      - name: Prepare build database
        run: npm run db:setup
        env:
          NODE_ENV: production

      - name: Build
        run: npm run build
